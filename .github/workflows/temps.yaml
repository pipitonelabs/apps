name: temps

on:
  push:
    branches: [main]
    paths:
      - temps/**
      - .github/workflows/temps.yaml
  pull_request:
    paths:
      - temps/**
      - .github/workflows/temps.yaml
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/temps

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Audit production dependencies
        working-directory: temps
        run: npm audit --omit=dev --audit-level=high

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: temps
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      - name: Smoke test container
        run: |
          docker run -d --name temps -p 8080:8080 -e PROM_URL=http://127.0.0.1:9 -e KROMGO_URL=http://127.0.0.1:9 -e TAUTULLI_URL=http://127.0.0.1:9 -e JELLYFIN_URL=http://127.0.0.1:9 ${{ env.IMAGE }}:${{ github.sha }}
          sleep 3
          docker logs temps
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/healthz)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/api/v1/labels)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8080/api/v1/query)" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' 'localhost:8080/api/v1/query?query=up')" = 502
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/kromgo/talos_version)" = 502
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/kromgo/../metrics)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8080/kromgo/talos_version)" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/streams/plex)" = 502
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/streams/jellyfin)" = 502
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/streams/other)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8080/streams/plex)" = 403

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name != 'pull_request'
        run: |
          docker tag ${{ env.IMAGE }}:${{ github.sha }} ${{ env.IMAGE }}:latest
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest
